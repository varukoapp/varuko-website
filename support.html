<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Varuko Support</title>
  <link rel="icon" href="assets/varuko-icon.png" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      background: #f7f7f3;
      color: #111827;
    }

    .legal-page {
      width: min(900px, 92vw);
      margin: 0 auto;
      padding: 48px 0 72px;
    }

    .legal-page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 36px;
    }

    .legal-page-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
      font-weight: 800;
      letter-spacing: 0.16em;
    }

    .legal-page-brand img {
      width: 44px;
      height: 44px;
    }

    .legal-page-back {
      color: #374151;
      text-decoration: none;
      font-weight: 700;
    }

    .legal-page article {
      background: #ffffff;
      border: 1px solid #dfe5df;
      border-radius: 22px;
      padding: 32px;
      white-space: pre-wrap;
      line-height: 1.75;
      font-size: 15px;
    }

    .legal-page h1 {
      font-size: clamp(34px, 5vw, 56px);
      margin: 0 0 12px;
    }

    .legal-page .eyebrow {
      color: #159447;
      font-weight: 800;
      letter-spacing: 0.18em;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="legal-page">
    <div class="legal-page-header">
      <a class="legal-page-brand" href="/">
        <img src="assets/varuko-icon.png" alt="" />
        <span>VARUKO</span>
      </a>
      <a class="legal-page-back" href="/">Back to Varuko.com</a>
    </div>

    <p class="eyebrow">VARUKO LEGAL</p>
    <h1>Support</h1>

    <article>
<h2>Contact Varuko</h2>
<p>For account assistance, technical problems, privacy questions
or general support, contact Varuko LLC.</p>

<p>Email:
<a href="mailto:info@varuko.com">info@varuko.com</a></p>

<p>For account deletion, visit our
<a href="/delete-account">account-deletion page</a>.</p>
</article>
  </main>
</body>
</html>
